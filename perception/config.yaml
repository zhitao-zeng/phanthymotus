mcp_port: 15720

plugins:
  asr:
    enabled: false
    mode: offline               # offline | streaming (online/segmented are legacy aliases)
    model_path: /models/sherpa-onnx/asr-offline
    asr_model: paraformer-zh-en   # paraformer-zh-en | zipformer-en
    model_dir: /models/sherpa-onnx/asr
    device: cpu
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
      pre_roll_ms: 500
    kws:
      enabled: false
      trigger_mode: vad
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: false
    model_dir: /models/sherpa-onnx/tts
    speaker_id: 0
    speed: 1.0

  htmsg:
    enabled: false
    namespace: ""       # auto-detect from hostname if empty
    keyframe:
      dist_thresh: 1.0    # meters — insert keyframe when moved this far
      angle_thresh: 0.35  # radians (~20°) — or rotated this much
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: false
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5

  ocr:
    enabled: true
    provider: rapidocr
    backend: mnn
    fallback_backend: ""
    url: ""
    key: ""
    model: ""
    model_dir: /models/ocr/ppocrv6-small-mnn
    fallback_model_dir: /models/ocr/ppocrv6-small-ort
    language: zh
    use_angle_cls: false
    num_threads: 1
    max_side_len: 960
    rec_min_score: 0.3          # MNN rec score 阈值（粗框不杀，留给 judge 的 IoU+LCS 判定）
    min_interval_ms: 0
    large_image_strategy:
      # 关闭分块：tile 跨边界切割产生无法去重的碎片框, predict_T 膨胀 77%, F1 崩塌
      enabled: false
      trigger_side: 2400
      decode_side: 3200
      decode_hard_limit: 4096
      tile_size: 1280
      overlap: 128
      max_tiles: 12
      global_pass: true
      dedup_iou: 0.5
      dedup_text_similarity: 0.8

  obstacle_distance:
    enabled: false
    mode: model
    backend_factory: ""
    scene_mode: metadata
    fixed_scene: ""
    depth_backend: lifelong_nk
    segmentation_backend: yolo26n_seg
    depth_model_dir: /models/obstacle-distance/lifelong-nk
    segmentation_model_dir: /models/obstacle-distance/yolo26n-seg
    decision_threshold_m: 1.0
    fallback_distance_m: 3.0
    soft_timeout_s: 2.5
    min_interval_ms: 0
    indoor:
      roi: [0, 300, 213, 426]
      min_depth_m: 0.3
      max_depth_m: 10.0
      percentile: 1.0
      min_valid_pixels: 64
    vehicle:
      allowed_classes: [person, car, truck, bus, motorcycle, bicycle]
      min_confidence: 0.25
      percentile: 1.0
      min_depth_m: 0.3
      max_depth_m: 80.0
      camera_to_bumper_offset_m: 1.0
      allow_approximate_geometry: false
      calibration: {}
