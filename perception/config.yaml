mcp_port: 15720

plugins:
  asr:
    enabled: true
    # Matches the configSchema default. The same SenseVoice candidate runs the
    # official fp32 export on JP6.1 CUDA and the stock int8 export on JP5.1.1 CPU.
    asr_model: sensevoice-small   # x-asr-zh-en | paraformer-zh-en | paraformer-offline | zipformer-en | sensevoice-small
    # auto | cpu | gpu. auto is asymmetric by design: JP6.1 -> fp32 CUDA,
    # JP5.1.1 -> int8 CPU, the latter avoiding the >3 GB process high-water mark
    # a JP5 CUDA context produced. Explicit gpu exists only in the JP6 image.
    #
    # cpu, not auto, because auto makes the JP6 build fetch the 938 MB fp32
    # bundle from hf-mirror.com, and the leaderboard build host answers 403 for
    # that domain — the 2026-09-19 run died there before any audio was decoded.
    # Everything the X-ASR line pulls comes from ModelScope and COS, which that
    # host can reach. Mirroring the bundle there would restore auto; until then
    # a GPU path nobody has validated on hardware is not worth a build that
    # cannot run.
    device: cpu
    num_threads: 2   # cpu only; 4 buys ~1.2-1.5x. Ignored on gpu.
    # Decode 1 s of silence after the model loads. On gpu the first inference
    # costs ~1.7 s (lazy kernels, cuDNN autotune, memory pool) against a 58 ms
    # steady state; without this the operator pays it on their first utterance.
    warmup: true
    language: zh-CN
    # SenseVoice has no beam-search hotword bias. sherpa-onnx instead applies a
    # conservative phrase-level pinyin FST after greedy decoding.
    sensevoice_homophone_replacer:
      enabled: true
      lexicon: /work/assets/sensevoice_hr/lexicon.txt
      rule_fst: /work/assets/sensevoice_hr/replace.fst
    vad:
      model: sherpa_onnx    # sherpa_onnx | silero (same silero_vad.onnx, via sherpa-onnx) | webrtc
      threshold: 0.5
      # 400ms closes a segment at every brief pause, so a bystander's sentence
      # becomes its own segment and gets transcribed. 700 merges it into the
      # segment carrying the command and the decoder stops emitting it. Measured
      # on the 42 V5 cases with this model: 58.53% -> 72.13% 1-CER, insertions
      # 180 -> 93.
      #
      # This was first found on the X-ASR transducer, where it is worth +10.59
      # on the leaderboard. It was not obvious it would carry: SenseVoice
      # decodes CTC greedily, and nothing about "a long utterance leaves the
      # rest blank" follows from scoring frames without an emitted prefix. It
      # carries, and by more (+13.60 here against +8.80 there) — but the reason
      # is still not understood on either architecture, so treat it as measured
      # behaviour rather than a property to rely on.
      #
      # Tuned on V5, which is the acceptance set. Same-set reading.
      silence_ms: 700
      pre_roll_ms: 250
    save_vad_segments: false
    kws:
      enabled: false
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: false
    engine: vits2_trt
    backend: trt
    model_dir: /models/vits2
    speaker_id: 0
    speed: 1.0
    warmup: true
    max_chunk_tokens: 256
    # sherpa_onnx engine only — vits2_trt runs on TensorRT and ignores this.
    # Matcha is fp32, so both devices load the same weights and only the provider
    # changes; gpu measured ~4.3x faster at num_threads=2.
    device: cpu

  vop:
    enabled: false
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5

  ocr:
    enabled: false
    provider: rapidocr
    model_dir: /models/ocr/ppocrv6-small-trt
    device_id: 0
    language: zh
    use_angle_cls: true
    max_side_len: 1600
    det_unclip_ratio: 0.7
    det_thresh: 0.3
    det_box_thresh: 0.5
    rec_min_score: 0.9
    crop_refinement:
      enabled: true
      min_score: 0.9
      min_gain: 0.12
      min_text_length: 2
      profiles: [prefix_65, upper_center, upper_tight]
    empty_result_retry:
      enabled: true
      det_thresh: 0.1
      det_box_thresh: 0.1
    min_interval_ms: 0
