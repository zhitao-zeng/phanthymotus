mcp_port: 15720

plugins:
  asr:
    enabled: true
    mode: offline               # offline | streaming (online/segmented are legacy aliases)
    model_path: /models/sherpa-onnx/x_asr_punct_int8
    asr_model: paraformer-zh-en   # paraformer-zh-en | zipformer-en
    model_dir: /models/sherpa-onnx/asr
    device: cpu
    hw_provider: cpu
    num_threads: 2
    language: zh-CN
    # x-asr transducer + modified_beam_search(5) + hotwords：ARM 实测 1-CER 0.8388，
    # mbs(5) 消除跨平台漂移，hotwords 偏置机器人动作术语（举双手/锁定站立等）再 +3.8pt。
    # 详见 docs/current-state.md §x-asr hotwords 调参结论。
    sherpa_config:
      tokens: tokens.txt
      numThreads: 2
      provider: cpu
      debug: false
      featureConfig:
        featureDim: 80
      recognizerConfig:
        decodingMethod: modified_beam_search
        maxActivePaths: 5
        # hotwords: 逐字空格分隔格式由 asr_offline.py 在加载时从 hotwordsFile
        # 原文转换（x-asr tokens.txt 全是 ▁X 单字 token，整词 BPE 编码会产出
        # tokens.txt 里没有的多字 piece，必须逐字喂入）。
        hotwordsFile: hotwords.txt   # 相对 model_path，234 个机器人动作术语
        hotwordsScore: 2.0
        modelingUnit: bpe
        bpeVocab: bpe.vocab
    vad:
      model: sherpa_onnx    # sherpa_onnx (ONNX, lightweight) | silero (PyTorch) | webrtc
      threshold: 0.5
      silence_ms: 400
      pre_roll_ms: 500
    kws:
      enabled: false
      trigger_mode: vad
      model_dir: /models/sherpa-onnx/kws
      keywords:
        - "x iǎo f àn x iǎo f àn @小范小范"

  tts:
    enabled: false
    model_dir: /models/sherpa-onnx/tts
    speaker_id: 0
    speed: 1.0

  htmsg:
    enabled: false
    namespace: ""       # auto-detect from hostname if empty
    keyframe:
      dist_thresh: 1.0    # meters — insert keyframe when moved this far
      angle_thresh: 0.35  # radians (~20°) — or rotated this much
    semantic:
      model: "mobileclip"
      sam_model: "sam2_tiny"
      confidence_decay: 0.95
    graph:
      db_path: "/opt/phanthy-motus/data/htmsg"
      max_nodes: 500

  vop:
    enabled: false
    namespace: ""       # auto-detect from hostname if empty
    model: "yolov8s-worldv2"
    confidence: 0.3
    classes: []         # empty = default broad set
    fps: 5

  ocr:
    enabled: false
    provider: rapidocr
    backend: mnn
    fallback_backend: ""
    url: ""
    key: ""
    model: ""
    model_dir: /models/ocr/ppocrv6-small-mnn
    fallback_model_dir: /models/ocr/ppocrv6-small-ort
    language: zh
    use_angle_cls: false
    num_threads: 1
    max_side_len: 960
    rec_min_score: 0.3          # MNN rec score 阈值（粗框不杀，留给 judge 的 IoU+LCS 判定）
    min_interval_ms: 0
    large_image_strategy:
      # 关闭分块：tile 跨边界切割产生无法去重的碎片框, predict_T 膨胀 77%, F1 崩塌
      enabled: false
      trigger_side: 2400
      decode_side: 3200
      decode_hard_limit: 4096
      tile_size: 1280
      overlap: 128
      max_tiles: 12
      global_pass: true
      dedup_iou: 0.5
      dedup_text_similarity: 0.8
